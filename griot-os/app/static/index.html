<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GRIOT OS — Strategic Intelligence Agent</title>
  <meta name="description" content="GRIOT OS is a strategic intelligence and execution agent: it diagnoses before it recommends, separates evidence from assumption, and remembers the decisions it helped you make. A product of SpeakPower." />
  <meta name="author" content="SpeakPower" />
  <meta name="theme-color" content="#283142" />

  <!-- Icons. The SVG adapts to the browser's light/dark tab bar; the PNGs are
       fallbacks for clients that do not support SVG favicons. -->
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/brand/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/static/brand/manifest.webmanifest" />

  <!-- Social preview: what a prospect sees when the link is shared. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SpeakPower" />
  <meta property="og:title" content="GRIOT OS — Strategic Intelligence Agent" />
  <meta property="og:description" content="Diagnoses before it recommends. Separates evidence from assumption. Remembers the decisions it helped you make." />
  <meta property="og:image" content="/static/brand/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GRIOT OS — Strategic Intelligence Agent" />
  <meta name="twitter:description" content="Diagnoses before it recommends. Separates evidence from assumption." />
  <meta name="twitter:image" content="/static/brand/og-card.png" />

  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <img class="mark" src="/static/brand/favicon.svg" alt="" width="34" height="34" />
        <div class="brand">GRIOT <span>OS</span></div>
      </div>
      <p class="tagline">Strategic intelligence &amp; execution</p>

      <label for="project">Project</label>
      <select id="project"></select>

      <label for="api-key">API key</label>
      <div id="key-bar" class="key-bar">
        <input id="api-key" type="password" autocomplete="off" spellcheck="false"
               placeholder="GRIOT_API_KEY" />
      </div>

      <div class="status-card">
        <span class="dot"></span>
        <div>
          <strong>GRIOT online</strong>
          <small id="status-detail">checking…</small>
        </div>
      </div>

      <button id="new-thread" class="ghost">Start new thread</button>

      <div class="sidebar-foot">
        <div class="principle">&ldquo;Never confuse activity with progress.&rdquo;</div>
        <div class="attribution">A product of <strong>SpeakPower</strong></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>What are we solving?</h1>
          <p>Give GRIOT the situation. It will route the right strategic specialists.</p>
        </div>
        <div class="topbar-meta">
          <span id="thread-label">new thread</span>
          <a href="/docs" target="_blank" rel="noopener">API docs</a>
        </div>
      </header>

      <section id="chat" class="chat"></section>

      <div class="composer">
        <textarea id="message" rows="3"
                  placeholder="e.g. Audit Tonninyira and tell me our biggest growth constraint."></textarea>
        <div class="composer-row">
          <div class="quick-actions">
            <button data-prompt="Challenge my current strategy. What am I missing?">Challenge</button>
            <button data-prompt="Give me a data-backed diagnosis before recommending action.">Diagnose</button>
            <button data-prompt="Turn this into a practical next-step plan.">Plan</button>
          </div>
          <button id="send" class="send">Ask GRIOT</button>
        </div>
      </div>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
