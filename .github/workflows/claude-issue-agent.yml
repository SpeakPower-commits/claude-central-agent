name: Universal Cross-Repository Auto-Engineer
on:
  issues:
    types: [opened]

jobs:
  analyze-and-patch:
    if: contains(github.event.issue.title, 'Audit') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Code Environment
        uses: actions/checkout@v4

      - name: Initialize Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Virtual Dependency Workspace
        run: |
          npm init -y
          npm install @anthropic-ai/sdk

      - name: Run Universal Multi-File Patch Engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.REPOS_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          CURRENT_OWNER: ${{ github.repository_owner }}
        run: |
          cat << 'EOF' > universal_patcher.js
          const { Anthropic } = require('@anthropic-ai/sdk');
          const https = require('https');
          const anthropic = new Anthropic();

          async function githubAPI(endpoint, method = 'GET', body = null) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: '://github.com',
                path: endpoint,
                method: method,
                headers: {
                  'User-Agent': 'Central-Claude-Auditor',
                  'Authorization': `Bearer ${process.env.AGENT_GITHUB_TOKEN}`,
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(data ? JSON.parse(data) : {});
                  } else { reject(new Error(`API Error: ${res.statusCode} - ${data}`)); }
                });
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          async function main() {
            const bodyText = process.env.ISSUE_BODY || "";
            
            const repoMatch = bodyText.match(/Repo:\s*([a-zA-Z0-9_\-\.\/]+)/i);
            if (!repoMatch) {
              throw new Error("Missing target repository! Please specify 'Repo: owner/repo-name' inside your issue body.");
            }
            
            let targetRepo = repoMatch[1].trim();
            if (!targetRepo.includes('/')) {
              targetRepo = `${process.env.CURRENT_OWNER}/${targetRepo}`;
            }
            
            console.log(`🌍 Target Repository established: ${targetRepo}`);

            const repoInfo = await githubAPI(`/repos/${targetRepo}`);
            const defaultBranch = repoInfo.default_branch || 'main';

            console.log("📁 Fetching root repository structure dynamically...");
            const repoTree = await githubAPI(`/repos/${targetRepo}/contents`);
            if (!Array.isArray(repoTree)) {
              throw new Error(`Failed to read structural contents of ${targetRepo}.`);
            }

            const allFiles = repoTree.filter(f => f.type === 'file').map(f => f.name);
            const criticalFiles = repoTree
              .filter(f => f.type === 'file' && (f.name.endsWith('.js') || f.name.endsWith('.html') || f.name.endsWith('.json')) && !f.name.includes('lock'))
              .map(f => f.name);

            const originalCodes = {};
            const fileShas = {};

            console.log(`📥 Downloading modules for audit: [${criticalFiles.join(', ')}]...`);
            for (const file of criticalFiles) {
              try {
                const fileData = await githubAPI(`/repos/${targetRepo}/contents/${file}`);
                if (fileData.content) {
                  originalCodes[file] = Buffer.from(fileData.content, 'base64').toString('utf8');
                  fileShas[file] = fileData.sha;
                }
              } catch (e) {
                console.error(`⚠️ Could not download ${file}: ${e.message}`);
              }
            }

            console.log("🧠 Transmitting architecture map to Claude for review and feature build...");

            let codeContextBlock = `Directory files layout: ${JSON.stringify(allFiles)}\n\n`;
            for (const [name, code] of Object.entries(originalCodes)) {
              codeContextBlock += `=== FILE: ${name} ===\n${code}\n==================\n\n`;
            }

            const promptInstructions = `
            You are a lead system engineer. Analyze the files provided and update them completely.
            
            FEATURE REQUIREMENT:
            Modify the codebase so that administrative and management roles (Admin Officer, Finance & Admin Manager, ED) can dynamically attach and append any number of supplementary forms/documents (e.g., LPOs, Evaluation Reports, GRNs, and Invoices) to ANY already submitted request object. Make sure the underlying request structures support tracking arrays of attachments.
            
            CRITICAL OUTPUT FORMATTING RULE:
            You must return each updated text file inside its own markdown code block. Start the code block with the exact comment indicator string '// FILENAME: filename.extension' followed by the code.
            Example:
            \`\`\`javascript
            // FILENAME: script.js
            [your modified code here]
            \`\`\`
            Do not write conversational text outside the markdown code blocks.
            `;

            const response = await anthropic.messages.create({
              model: "claude-3-5-sonnet-20241022",
              max_tokens: 4000,
              system: promptInstructions,
              messages: [{ role: "user", content: `${codeContextBlock}\n\nUser Request:\n${bodyText}` }]
            });

            const aiText = response.content[0].text;
            const blockRegex = /```(?:javascript|html|json)?([\s\S]*?)```/g;
            
            const newBranchName = `claude-patch-issue-${process.env.ISSUE_NUMBER}`;
            console.log(`🌿 Creating clean review branch: ${newBranchName}...`);
            
            const mainBranchData = await githubAPI(`/repos/${targetRepo}/git/ref/heads/${defaultBranch}`);
            const mainLatestSha = mainBranchData.object.sha;

            await githubAPI(`/repos/${targetRepo}/git/refs`, 'POST', {
              ref: `refs/heads/${newBranchName}`,
              sha: mainLatestSha
            });

            let match;
            let patchedCounter = 0;

            while ((match = blockRegex.exec(aiText)) !== null) {
              const codeBlock = match[1].trim();
              const nameMatch = codeBlock.match(/\/\/ FILENAME:\s*([a-zA-Z0-9_\.-]+)/);
              
              if (nameMatch) {
                const targetedFileName = nameMatch[1].trim();
                if (fileShas[targetedFileName]) {
                  console.log(`🚀 Uploading upgrades to branch for ${targetedFileName}...`);
                  
                  const updatedPayload = {
                    message: `🤖 Claude upgrade for ${targetedFileName}`,
                    content: Buffer.from(codeBlock).toString('base64'),
                    sha: fileShas[targetedFileName],
                    branch: newBranchName
                  };

                  await githubAPI(`/repos/${targetRepo}/contents/${targetedFileName}`, 'PUT', updatedPayload);
                  patchedCounter++;
                }
              }
            }

            if (patchedCounter === 0) {
              throw new Error("Could not parse clean code blocks from Claude.");
            }

            console.log("🔀 Opening GitHub Pull Request for your safety review...");
            const prResponse = await githubAPI(`/repos/${targetRepo}/pulls`, 'POST', {
              title: `🤖 Review Required: Claude Upgrade for Issue #${process.env.ISSUE_NUMBER}`,
              head: newBranchName,
              base: defaultBranch,
              body: `This Pull Request contains the code changes generated by Claude to add multi-form attachments.\n\n### 🔍 Please review these file edits before clicking Merge.`
            });

            console.log("📤 Logging PR URL back to the issue...");
            await githubAPI(`/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.ISSUE_NUMBER}/comments`, 'POST', {
              body: `🎉 **Code Upgrades Ready for Review!**\n\nClaude has built your multi-form attachment features! To keep your system safe, a secure review branch has been opened.\n\n🔗 **[Click Here to Review and Approve the Changes](${prResponse.html_url})**`
            });

            console.log("🎉 Process completed safely!");
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF
          node universal_patcher.js


