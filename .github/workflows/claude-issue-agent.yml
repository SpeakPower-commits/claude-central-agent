name: Universal Multi-Project AI Engineer
on:
  issues:
    types: [opened, edited]

jobs:
  universal-engineer:
    if: contains(github.event.issue.title, 'Audit') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Code Environment
        uses: actions/checkout@v4

      - name: Initialize Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Virtual Dependency Workspace
        run: |
          npm init -y
          npm install @anthropic-ai/sdk

      - name: Run Global Cross-Project Engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.REPOS_PAT }} # Make sure this PAT token has access to ALL targeted repositories!
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > universal_patcher.js
          const { Anthropic } = require('@anthropic-ai/sdk');
          const https = require('https');
          const anthropic = new Anthropic();

          async function githubAPI(endpoint, method = 'GET', body = null) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: '://github.com',
                path: endpoint,
                method: method,
                headers: {
                  'User-Agent': 'Universal-Claude-Agent',
                  'Authorization': `Bearer ${process.env.AGENT_GITHUB_TOKEN}`,
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(data ? JSON.parse(data) : {});
                  } else { reject(new Error(`API Error: ${res.statusCode} - ${data}`)); }
                });
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          async function main() {
            const bodyText = process.env.ISSUE_BODY || "";
            
            // Regex to find "Target: owner/repository" anywhere in your issue body text
            const targetRegex = /Target:\s*([a-zA-Z0-9_\.-]+\/[a-zA-Z0-9_\.-]+)/i;
            const targetMatch = bodyText.match(targetRegex);
            
            if (!targetMatch) {
              throw new Error("Missing target repository mapping! Please add 'Target: owner/repo-name' somewhere inside your issue description.");
            }
            
            const targetRepo = targetMatch[1].trim();
            console.log(`🌐 Universal mode activated. Target Repository Identified: ${targetRepo}`);

            console.log(`📥 Inspecting remote repository structure...`);
            const repoTree = await githubAPI(`/repos/${targetRepo}/contents`);
            
            if (!Array.isArray(repoTree)) {
              throw new Error(`Failed to read content list for ${targetRepo}. Verify repository exists and permissions match.`);
            }

            const allFiles = repoTree.filter(f => f.type === 'file').map(f => f.name);
            console.log(`📋 Found files: [${allFiles.join(', ')}]`);

            // Automatically extract up to 4 major logic files found in the project root to analyze
            const codeExtensions = ['.js', '.ts', '.py', '.html', '.css', '.json'];
            const filesToAnalyze = repoTree
              .filter(f => f.type === 'file' && codeExtensions.some(ext => f.name.endsWith(ext)) && !f.name.includes('lock'))
              .slice(0, 4) // Scan up to 4 core files to protect API context token size limits
              .map(f => f.name);

            const fileContentsMap = {};
            const fileShas = {};

            console.log(`📥 Downloading code data for target modules: [${filesToAnalyze.join(', ')}]...`);
            for (const file of filesToAnalyze) {
              try {
                const fileData = await githubAPI(`/repos/${targetRepo}/contents/${file}`);
                if (fileData.content) {
                  fileContentsMap[file] = Buffer.from(fileData.content, 'base64').toString('utf8');
                  fileShas[file] = fileData.sha;
                }
              } catch (err) {
                console.error(`⚠️ Skipping file ${file}: ${err.message}`);
              }
            }

            let fileCodeContext = "";
            for (const [name, text] of Object.entries(fileContentsMap)) {
              fileCodeContext += `=== FILE: ${name} ===\n${text}\n==================\n\n`;
            }

            console.log("🧠 Consulting Claude Engine for cross-project code construction...");
            
            const systemPrompt = `
            You are an elite, universal multi-language cloud engineer. Your task is to process the files provided, analyze the user's explicit structural changes, and rewrite the required code modules.
            
            CRITICAL FORMATTING INSTRUCTIONS:
            Return ONLY the updated file contents. Each file MUST be wrapped in a single clean markdown block starting with an identifier comment layout telling us the name.
            Example:
            \`\`\`javascript
            // FILENAME: database.js
            [updated code here]
            \`\`\`
            
            Do not write explanation paragraphs or greetings outside the raw code blocks. Fix only files that require changes based on the user instruction.
            `;

            const response = await anthropic.messages.create({
              model: "claude-sonnet-4-6",
              max_tokens: 4000,
              system: systemPrompt,
              messages: [{ role: "user", content: `Available files tree: ${JSON.stringify(allFiles)}\n\nCore File Codes:\n${fileCodeContext}\n\nUser Engineering Request:\n${bodyText}` }]
            });

            const aiText = response.content.text;
            const blockRegex = /```[a-zA-Z]*([\s\S]*?)```/g;
            let match;
            let successfullyPatched = 0;

            while ((match = blockRegex.exec(aiText)) !== null) {
              const codeBlock = match[1].trim();
              const filenameMatch = codeBlock.match(/\/\/ FILENAME:\s*([a-zA-Z0-9_\.-]+)/);
              
              if (filenameMatch) {
                const destinationFile = filenameMatch[1].trim();
                
                if (fileShas[destinationFile]) {
                  console.log(`🚀 Overwriting updated code definitions back into ${targetRepo}/${destinationFile}...`);
                  
                  const commitPayload = {
                    message: `🤖 Autonomous AI Engineering Patch - (Triggered by Controller Issue #${process.env.ISSUE_NUMBER})`,
                    content: Buffer.from(codeBlock).toString('base64'),
                    sha: fileShas[destinationFile]
                  };

                  await githubAPI(`/repos/${targetRepo}/contents/${destinationFile}`, 'PUT', commitPayload);
                  successfullyPatched++;
                }
              }
            }

            console.log("📤 Sending deployment summary comment back to the dashboard repo...");
            let notificationMessage = `### 🌐 Cross-Project Engine Operations Complete!\n\n**Target Repository Connected:** \`${targetRepo}\`\n`;
            if (successfullyPatched > 0) {
              notificationMessage += `🎉 Successfully refactored and updated **${successfullyPatched} source file(s)** directly inside the target project codebase!`;
            } else {
              notificationMessage += `⚠️ Claude evaluated the project codebase, but no dynamic code patches could be cleanly isolated. Double-check your instructions or file formatting requirements!`;
            }

            await githubAPI(`/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.ISSUE_NUMBER}/comments`, 'POST', {
              body: notificationMessage
            });
            console.log("🎉 Run completed successfully!");
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF
          node universal_patcher.js

