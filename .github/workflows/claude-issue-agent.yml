name: Global Repository Analyzer & Patcher
on:
  issues:
    types: [opened]

jobs:
  analyze-and-patch:
    if: contains(github.event.issue.title, 'Audit') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Code Environment
        uses: actions/checkout@v4

      - name: Initialize Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Virtual Dependency Workspace
        run: |
          npm init -y
          npm install @anthropic-ai/sdk

      - name: Run Global Audit & Auto-Patch Engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.REPOS_PAT }}
          TARGET_REPO: "CuePointe/UBF-Request-Portal"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << 'EOF' > patcher.js
          const { Anthropic } = require('@anthropic-ai/sdk');
          const https = require('https');
          const anthropic = new Anthropic();

          async function githubAPI(endpoint, method = 'GET', body = null) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: '://github.com',
                path: endpoint,
                method: method,
                headers: {
                  'User-Agent': 'Central-Claude-Auditor',
                  'Authorization': `Bearer ${process.env.AGENT_GITHUB_TOKEN}`,
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(data ? JSON.parse(data) : {});
                  } else { reject(new Error(`API Error: ${res.statusCode} - ${data}`)); }
                });
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          async function main() {
            const targetFile = 'form-renderer.js'; // The core heavy module we want Claude to patch
            console.log(`📥 Fetching current ${targetFile} content...`);
            
            const fileData = await githubAPI(`/repos/${process.env.TARGET_REPO}/contents/${targetFile}`);
            if (!fileData.content) throw new Error(`Could not load ${targetFile}`);
            
            const currentCode = Buffer.from(fileData.content, 'base64').toString('utf8');
            const fileSha = fileData.sha; // Required by GitHub to update an existing file

            console.log("🧠 Requesting optimization and direct code rewrite from Claude...");
            
            const response = await anthropic.messages.create({
              model: "claude-sonnet-4-6",
              max_tokens: 4000,
              system: `You are an expert software engineer. Analyze the provided file and rewrite it completely to fix performance bottlenecks, bugs, or clean up structure based on the user request. 
              CRITICAL: Output ONLY the raw, updated JavaScript code inside a single markdown code block starting with \`\`\`javascript and ending with \`\`\`. Do not include conversational text outside the code block.`,
              messages: [{ role: "user", content: `Current Code of ${targetFile}:\n\`\`\`javascript\n${currentCode}\n\`\`\`\n\nUser Request/Audit Context: ${process.env.ISSUE_BODY}` }]
            });

            const rawText = response.content[0].text;
            
            // Extract the clean JavaScript code out of Claude's markdown wrapper
            const regex = /```javascript([\s\S]*?)```/;
            const match = rawText.match(regex);
            
            if (!match || !match[1]) {
              throw new Error("Claude did not return a clean code block. Aborting push to prevent corruption.");
            }
            
            const upgradedCode = match[1].trim();

            console.log(`📤 Pushing optimized ${targetFile} directly back to the repository...`);
            
            const updatedFilePayload = {
              message: `🤖 Auto-patcher optimization for ${targetFile} (Issue #${process.env.ISSUE_NUMBER})`,
              content: Buffer.from(upgradedCode).toString('base64'), // Convert raw text back to base64
              sha: fileSha // Verifies we are modifying the correct version
            };

            await githubAPI(`/repos/${process.env.TARGET_REPO}/contents/${targetFile}`, 'PUT', updatedFilePayload);
            
            console.log("📤 Logging completion message back to the GitHub issue thread...");
            await githubAPI(`/repos/CuePointe/claude-central-agent/issues/${process.env.ISSUE_NUMBER}/comments`, 'POST', {
              body: `🎉 **Success!** Claude analyzed \`${targetFile}\`, refactored the processing algorithms, and committed the changes directly back to your codebase.`
            });
            
            console.log("🎉 Process finished seamlessly!");
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF
          node patcher.js
