name: Universal Cross-Repository Auto-Engineer
on:
  issues:
    types: [opened]

jobs:
  analyze-and-patch:
    if: contains(github.event.issue.title, 'Audit') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Code Environment
        uses: actions/checkout@v4

      - name: Initialize Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Virtual Dependency Workspace
        run: |
          npm init -y
          npm install @anthropic-ai/sdk

      - name: Run Clean Patch Engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.REPOS_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          CURRENT_OWNER: ${{ github.repository_owner }}
        run: |
          cat << 'EOF' > universal_patcher.js
          const { Anthropic } = require('@anthropic-ai/sdk');
          const https = require('https');
          const anthropic = new Anthropic();

          async function githubAPI(endpoint, method = 'GET', body = null) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.github.com', // Corrected domain
                path: endpoint,
                method: method,
                headers: {
                  'User-Agent': 'Central-Claude-Auditor',
                  'Authorization': `Bearer ${process.env.AGENT_GITHUB_TOKEN}`,
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(data ? JSON.parse(data) : {});
                  } else { reject(new Error(`API Error: ${res.statusCode} - ${data}`)); }
                });
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          async function main() {
            const bodyText = process.env.ISSUE_BODY || "";
            const repoMatch = bodyText.match(/Repo:\s*([a-zA-Z0-9_\-\.\/]+)/i);
            if (!repoMatch) throw new Error("Missing 'Repo: owner/repo-name' in issue body.");
            
            let targetRepo = repoMatch[1].trim();
            if (!targetRepo.includes('/')) {
              targetRepo = `${process.env.CURRENT_OWNER}/${targetRepo}`;
            }
            
            console.log(`🌍 Target Repository established: ${targetRepo}`);
            console.log("📁 Fetching root repository structure dynamically...");
            
            const repoTree = await githubAPI(`/repos/${targetRepo}/contents`);
            console.log("🎉 Successfully fetched repository structure without network errors!");
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF
          node universal_patcher.js


          main().catch(err => { console.error(err); process.exit(1); });
          EOF
          node universal_patcher.js


