name: Universal Cross-Repository Auto-Engineer
on:
  issues:
    types: [opened]

jobs:
  analyze-and-patch:
    if: contains(github.event.issue.title, 'Audit') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Code Environment
        uses: actions/checkout@v4

      - name: Initialize Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Virtual Dependency Workspace
        run: |
          npm init -y
          npm install @anthropic-ai/sdk

      - name: Run Universal Multi-File Patch Engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_GITHUB_TOKEN: ${{ secrets.REPOS_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          CURRENT_OWNER: ${{ github.repository_owner }}
        run: |
          cat << 'EOF' > universal_patcher.js
          const { Anthropic } = require('@anthropic-ai/sdk');
          const https = require('https');
          const anthropic = new Anthropic();

          async function githubAPI(endpoint, method = 'GET', body = null) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: '://github.com',
                path: endpoint,
                method: method,
                headers: {
                  'User-Agent': 'Central-Claude-Auditor',
                  'Authorization': `Bearer ${process.env.AGENT_GITHUB_TOKEN}`,
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
                }
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(data ? JSON.parse(data) : {});
                  } else { reject(new Error(`API Error: ${res.statusCode} - ${data}`)); }
                });
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          async function main() {
            const bodyText = process.env.ISSUE_BODY || "";
            
            // Extract repository name from issue body
            const repoMatch = bodyText.match(/Repo:\s*([a-zA-Z0-9_\-\.\/]+)/i);
            if (!repoMatch) {
              throw new Error("Missing target repository! Please specify 'Repo: owner/repo-name' inside your issue body.");
            }
            
            let targetRepo = repoMatch[1].trim();
            if (!targetRepo.includes('/')) {
              targetRepo = `${process.env.CURRENT_OWNER}/${targetRepo}`;
            }
            
            console.log(`🌍 Target Repository dynamically established: ${targetRepo}`);

            console.log("📁 Fetching root repository structure dynamically...");
            const repoTree = await githubAPI(`/repos/${targetRepo}/contents`);
            if (!Array.isArray(repoTree)) {
              throw new Error(`Failed to read structural contents of ${targetRepo}. Verify token permissions.`);
            }

            const allFiles = repoTree.filter(f => f.type === 'file').map(f => f.name);
            const criticalFiles = repoTree
              .filter(f => f.type === 'file' && (f.name.endsWith('.js') || f.name.endsWith('.html') || f.name.endsWith('.json')) && !f.name.includes('lock'))
              .map(f => f.name);

            if (criticalFiles.length === 0) {
              throw new Error("No primary application files (.js, .html, .json) found to audit in this repository root.");
            }

            const originalCodes = {};
            const fileShas = {};

            console.log(`📥 Automatically downloading core logic modules: [${criticalFiles.join(', ')}]...`);
            for (const file of criticalFiles) {
              try {
                const fileData = await githubAPI(`/repos/${targetRepo}/contents/${file}`);
                if (fileData.content) {
                  originalCodes[file] = Buffer.from(fileData.content, 'base64').toString('utf8');
                  fileShas[file] = fileData.sha;
                }
              } catch (e) {
                console.error(`⚠️ Could not download ${file}: ${e.message}`);
              }
            }

            console.log("🧠 Transmitting architecture map to Claude for autonomous engineering updates...");

            let codeContextBlock = `Directory files layout: ${JSON.stringify(allFiles)}\n\n`;
            for (const [name, code] of Object.entries(originalCodes)) {
              codeContextBlock += `=== FILE: ${name} ===\n${code}\n==================\n\n`;
            }

            const promptInstructions = `
            You are a universal principal system architect and cross-functional software engineer. Your job is to analyze the provided files and fully execute the user's modifications directly on the code blocks.
            
            CRITICAL OUTPUT FORMATTING RULE:
            You must return each updated text file inside its own markdown code block. Start the code block with the exact comment indicator string '// FILENAME: filename.extension' followed by the code.
            Example:
            \`\`\`javascript
            // FILENAME: script.js
            [your modified code here]
            \`\`\`
            Do not write conversational text outside the markdown code blocks.
            `;

            const response = await anthropic.messages.create({
              model: "claude-sonnet-4-6",
              max_tokens: 4000,
              system: promptInstructions,
              messages: [{ role: "user", content: `${codeContextBlock}\n\nUser Engineering Request:\n${bodyText}` }]
            });

            const aiText = response.content[0].text;
            const blockRegex = /```(?:javascript|html|json)?([\s\S]*?)```/g;
            let match;
            let patchedCounter = 0;

            while ((match = blockRegex.exec(aiText)) !== null) {
              const codeBlock = match[1].trim();
              const nameMatch = codeBlock.match(/\/\/ FILENAME:\s*([a-zA-Z0-9_\.-]+)/);
              
              if (nameMatch) {
                const targetedFileName = nameMatch[1].trim();
                if (fileShas[targetedFileName]) {
                  console.log(`🚀 Injecting engineered upgrades directly into ${targetedFileName}...`);
                  
                  const updatedPayload = {
                    message: `🤖 Autonomous feature deployment: Engineering updates for ${targetedFileName} (Issue #${process.env.ISSUE_NUMBER})`,
                    content: Buffer.from(codeBlock).toString('base64'),
                    sha: fileShas[targetedFileName]
                  };

                  await githubAPI(`/repos/${targetRepo}/contents/${targetedFileName}`, 'PUT', updatedPayload);
                  patchedCounter++;
                }
              }
            }

            if (patchedCounter === 0) {
              throw new Error("Could not parse clean code fragments from Claude's response. Ensure format matches the pattern rule.");
            }

            console.log("📤 Logging completion details back to the agent controller dashboard...");
            await githubAPI(`/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.ISSUE_NUMBER}/comments`, 'POST', {
              body: `🎉 **Universal Architecture Upgrade Complete!**\n\nClaude has scanned the targeted codebase at \`${targetRepo}\`, mapped its critical application patterns, and pushed the requested engineering updates directly to the repository files successfully.`
            });

            console.log("🎉 Process completed flawlessly!");
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF
          node universal_patcher.js


