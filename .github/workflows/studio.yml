name: Studio — edit a recording

# Run by hand from the Actions tab only. There is deliberately no push or
# pull_request trigger: this workflow spends API credits and runner minutes,
# so it must never fire on its own. workflow_dispatch also means only people
# with write access to this repository can start it.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Link to the recording (Google Drive, YouTube, Dropbox — sharing set to 'anyone with the link')"
        required: true
        type: string
      mode:
        description: "What to do. transcribe = get the words out (FREE). cut = render the clip list below (FREE). auto = Claude picks the moments (NEEDS PAID API CREDIT)"
        required: true
        type: choice
        default: "transcribe"
        options: ["transcribe", "cut", "auto"]
      clip_list:
        description: "For 'cut' mode: one clip per line - start end title. e.g. 00:03:12 00:03:58 Why NGOs waste their comms budget"
        required: false
        type: string
        default: ""
      context:
        description: "What is this? e.g. 'Interview with a church media director about donor communication'"
        required: false
        type: string
        default: ""
      clips:
        description: "How many shorts to aim for"
        required: false
        type: choice
        default: "8"
        options: ["4", "6", "8", "10", "12"]
      style:
        description: "Framing — blur keeps the whole picture, crop fills the screen"
        required: false
        type: choice
        default: "blur"
        options: ["blur", "crop"]
      include_episode:
        description: "Also produce the cleaned full episode (slow, and a large download)"
        required: false
        type: boolean
        default: false

# Two runs at once would race over the same cache and burn minutes twice.
concurrency:
  group: studio-${{ github.actor }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edit:
    runs-on: ubuntu-latest
    # A long podcast with the full episode enabled can genuinely take hours.
    timeout-minutes: 300

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: studio/requirements.txt

      - name: Install ffmpeg
        # ffmpeg is NOT on GitHub's Ubuntu runner image, so it has to be
        # installed. An earlier version of this workflow only checked for it
        # and ran `ffmpeg -version | head -1`; steps run under `bash -e` with
        # no `pipefail`, so the pipeline took head's exit code, the step went
        # green, and the job died later at the first real ffmpeg call.
        #
        # Hence: install, then verify each binary on its own line, unpiped, so
        # a missing one actually fails this step.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
          command -v ffmpeg
          command -v ffprobe

      - name: Install dependencies
        working-directory: studio
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Edit the recording
        working-directory: studio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          STUDIO_MODEL: ${{ vars.STUDIO_MODEL || 'claude-sonnet-5-5' }}
          STUDIO_WHISPER_MODEL: ${{ vars.STUDIO_WHISPER_MODEL || 'small' }}
          # Inputs arrive as environment variables rather than being pasted
          # into the command line. A title containing a quote would otherwise
          # end the shell argument and run whatever followed it.
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_CONTEXT: ${{ inputs.context }}
          INPUT_CLIPS: ${{ inputs.clips }}
          INPUT_STYLE: ${{ inputs.style }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CLIP_LIST: ${{ inputs.clip_list }}
          # A workflow_dispatch boolean can arrive as the STRING "false",
          # which is truthy, so this compares against both forms. Getting it
          # wrong silently inverts whether the long edit is produced.
          INCLUDE_EPISODE: ${{ (inputs.include_episode == true || inputs.include_episode == 'true') && '1' || '' }}
        run: |
          set -euo pipefail
          EPISODE_FLAG=""
          if [ -z "$INCLUDE_EPISODE" ]; then
            EPISODE_FLAG="--skip-episode"
          fi
          echo "Episode flag: ${EPISODE_FLAG:-<producing full episode>}"

          # The clip list goes via a file rather than the command line: it can
          # be long, and writing it out keeps it out of argv entirely.
          CLIPS_FLAG=""
          if [ -n "${INPUT_CLIP_LIST:-}" ]; then
            printf '%s\n' "$INPUT_CLIP_LIST" > "$RUNNER_TEMP/clips.txt"
            CLIPS_FLAG="--clips-file $RUNNER_TEMP/clips.txt"
            echo "Clip list supplied ($(wc -c < "$RUNNER_TEMP/clips.txt") bytes)"
          fi

          python run.py \
            --source "$INPUT_SOURCE" \
            --context "$INPUT_CONTEXT" \
            --clips "$INPUT_CLIPS" \
            --style "$INPUT_STYLE" \
            --mode "$INPUT_MODE" \
            --out "$GITHUB_WORKSPACE/studio-output" \
            $CLIPS_FLAG \
            $EPISODE_FLAG

      - name: Put the summary on the run page
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/studio-output/SUMMARY.md" ]; then
            cat "$GITHUB_WORKSPACE/studio-output/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary was produced — check the log above for what failed." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the shorts and text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-shorts
          # Everything except the full episode, which is uploaded separately so
          # a large file cannot stop you getting the clips.
          path: |
            studio-output/**
            !studio-output/episode-cleaned.mp4
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the cleaned episode
        if: always() && inputs.include_episode
        uses: actions/upload-artifact@v4
        with:
          name: studio-episode
          path: studio-output/episode-cleaned.mp4
          if-no-files-found: ignore
          retention-days: 7
